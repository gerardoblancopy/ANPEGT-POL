    weight: 0.3
  - source_id: educacion_plan
    target_id: energia_plan
    weight: 0.5

  # Alternatives -> Criteria feedback (sectors influence criteria importance)
  - source_id: salud_plan
    target_id: equidad
    weight: 0.7
  - source_id: educacion_plan
    target_id: equidad
    weight: 0.6
  - source_id: energia_plan
    target_id: sostenibilidad
    weight: 0.8
  - source_id: seguridad_plan
    target_id: institucionalidad
    weight: 0.7
  - source_id: salud_plan
    target_id: disciplina_fiscal
    weight: 0.5
  - source_id: energia_plan
    target_id: empleo
