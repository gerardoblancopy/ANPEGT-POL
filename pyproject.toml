[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anpegt-pol"
version = "0.1.0"
description = "Adaptive Government Planning with ANP, Embeddings, Game Theory, and Political LLM Agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "click>=8.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
embeddings = ["transformers>=4.30", "torch>=2.0", "sentence-transformers>=2.0"]
audio = ["faster-whisper>=0.9"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
dev = ["pytest>=7.0", "pytest-asyncio", "ruff", "mypy"]

[project.scripts]
anpegt = "anpegt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
